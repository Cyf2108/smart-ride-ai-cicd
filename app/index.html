<!DOCTYPE html>
<html>
<head>
    <title>Smart Ride Fare Predictor</title>
</head>
<body>
    <h1>Smart Ride Fare Predictor</h1>

    <form id="fareForm">
        <label>Distance (km):</label>
        <input type="number" step="0.01" id="distance_km" required><br><br>

        <label>Traffic Level (1-5):</label>
        <input type="number" id="traffic_level" min="1" max="5" required><br><br>

        <button type="submit">Predict Fare</button>
    </form>

    <h2 id="result"></h2>

    <script>
        document.getElementById("fareForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const distance = document.getElementById("distance_km").value;
            const traffic = document.getElementById("traffic_level").value;

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    distance_km: parseFloat(distance),
                    traffic_level: parseInt(traffic)
                })
            });

            const data = await response.json();
            document.getElementById("result").innerText = data.predicted_fare;
        });
    </script>
</body>
</html>
